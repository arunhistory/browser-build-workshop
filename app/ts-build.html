<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>TS Build | browser-build-workshop</title>
  <meta
    name="description"
    content="TypeScript を JavaScript へ変換するためのビルド作業ページ"
  />
  <link rel="stylesheet" href="../assets/css/common.css" />
</head>

<body>
  <main class="page">
    <section class="topbar">
      <div class="topbar-actions">
        <button class="btn btn-muted" id="goHome" type="button">トップへ戻る</button>
        <button class="btn btn-secondary" id="goRustPage" type="button">Rust変換へ</button>
      </div>

      <div class="title-box">
        <h1>TS Build</h1>
        <p>TypeScript を JavaScript へ変換するためのビルド作業ページ</p>
      </div>
    </section>

    <section class="panel">
      <h2>プロジェクト設定</h2>

      <div class="form-row">
        <label for="projectName">プロジェクト名</label>
        <input id="projectName" type="text" value="sample-ts-project" />
      </div>

      <div class="form-row">
        <label for="fileName">エントリーファイル名</label>
        <input id="fileName" type="text" value="main.ts" />
      </div>

      <div class="form-row">
        <label for="outputName">出力ファイル名</label>
        <input id="outputName" type="text" value="index.js" />
      </div>

      <div class="form-row">
        <label for="moduleMode">module</label>
        <select id="moduleMode">
          <option value="esnext" selected>esnext</option>
          <option value="commonjs">commonjs</option>
          <option value="none">none</option>
        </select>
      </div>

      <div class="form-row">
        <label for="targetMode">target</label>
        <select id="targetMode">
          <option value="browser" selected>browser</option>
          <option value="module">module</option>
          <option value="node">node</option>
        </select>
      </div>
    </section>

    <section class="panel">
      <h2>ファイル管理</h2>

      <div class="button-row">
        <button class="btn btn-secondary" id="addFile" type="button">ファイル追加</button>
        <button class="btn btn-muted" id="deleteFile" type="button">現在のファイル削除</button>
        <button class="btn btn-muted" id="saveDraft" type="button">下書き保存</button>
        <button class="btn btn-muted" id="loadDraft" type="button">下書き読込</button>
      </div>

      <div id="fileList" class="file-list"></div>
    </section>

    <section class="panel">
      <h2>メインTypeScriptコード</h2>

      <textarea
        id="tsInput"
        class="code-area"
        spellcheck="false"
      >import type { ExternalUser } from "./types";
import { helper } from "./helper";

type User = {
  id: number;
  name: string;
  age?: number;
};

interface Profile {
  title: string;
  level: number;
}

enum Role {
  Guest,
  Member = 10,
  Admin
}

const user: User = {
  id: 1,
  name: "Orikuro",
  age: 20
};

let count: number = 0;

function hello(target: User): string {
  return `Hello, ${target.name}`;
}

const add = (a: number, b: number): number => {
  return a + b;
};

class Account implements Profile {
  public title: string = "main";
  private secret: string = "hidden";
  protected level: number = 1;
  readonly owner: string = "owner";

  constructor(name: string) {
    this.title = name;
  }

  public show(): string {
    return `${this.title}:${this.level}`;
  }
}

const account = new Account(user.name);

const result = hello(user);
const sum = add(1, 2);
const role = Role.Admin;

console.log(result);
console.log(sum);
console.log(role);
console.log(account.show());

export function exportedTest(value: User): string {
  return value.name as string;
}</textarea>
    </section>

    <section class="panel">
      <h2>変換オプション</h2>

      <div class="checkboxes">
        <label class="checkbox">
          <input id="enableMinify" type="checkbox" />
          圧縮を有効にする
        </label>

        <label class="checkbox">
          <input id="enableObfuscate" type="checkbox" />
          難読化を有効にする
        </label>

        <label class="checkbox">
          <input id="keepComments" type="checkbox" checked />
          コメントを残す
        </label>

        <label class="checkbox">
          <input id="strictMode" type="checkbox" checked />
          "use strict" を付ける
        </label>
      </div>

      <div class="button-row">
        <button class="btn btn-primary" id="runBuild" type="button">変換実行</button>
        <button class="btn btn-muted" id="clearLog" type="button">ログ削除</button>
      </div>
    </section>

    <section class="panel">
      <h2>ログ</h2>
      <pre id="logOutput" class="log-box">待機中...</pre>
    </section>

    <section class="panel">
      <h2>JavaScript出力</h2>

      <textarea
        id="jsOutput"
        class="code-area"
        spellcheck="false"
        readonly
        placeholder="変換後の JavaScript がここに表示されます"
      ></textarea>

      <div class="button-row">
        <button class="btn btn-secondary" id="downloadJs" type="button">JS保存</button>
        <button class="btn btn-secondary" id="downloadLog" type="button">ログ保存</button>
        <button class="btn btn-secondary" id="downloadAll" type="button">まとめて保存</button>
      </div>
    </section>
  </main>

  <script src="../assets/js/ts/core/ts-state.js"></script>
  <script src="../assets/js/ts/core/ts-file-store.js"></script>
  <script src="../assets/js/ts/core/ts-logger.js"></script>
  <script src="../assets/js/ts/core/ts-compiler.js"></script>
  <script src="../assets/js/ts/core/ts-minifier.js"></script>
  <script src="../assets/js/ts/core/ts-obfuscator.js"></script>
  <script src="../assets/js/ts/core/ts-output-manager.js"></script>
  <script src="../assets/js/ts/core/ts-storage.js"></script>
  <script src="../assets/js/ts/core/ts-downloader.js"></script>
  <script src="../assets/js/ts/ts-build-engine.js"></script>
  <script src="../assets/js/ts/ts-build-page.js"></script>
</body>
</html>
