<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>TS Build | browser-build-workshop</title>
  <meta
    name="description"
    content="TypeScript を JavaScript へ変換するためのビルド作業ページ"
  />
  <link rel="stylesheet" href="../assets/css/common.css" />
</head>
<body>
  <main class="page">
    <section class="topbar">
      <div class="topbar-actions">
        <button class="btn btn-muted" id="goHome">トップへ戻る</button>
        <button class="btn btn-secondary" id="goRustPage">Rust変換へ</button>
      </div>

      <div class="title-box">
        <h1>TS Build</h1>
        <p>
          TypeScript を JavaScript へ変換するための作業ページ。
          単一入力だけでなく、補助ファイル・出力名・出力内容確認まで含めた土台として扱う。
        </p>
      </div>
    </section>

    <section class="layout">
      <article class="panel">
        <h2>入力と設定</h2>

        <div class="field">
          <label for="projectName">プロジェクト名</label>
          <input
            type="text"
            id="projectName"
            placeholder="例: sample-ts-project"
            value="sample-ts-project"
          />
        </div>

        <div class="row">
          <div class="field">
            <label for="entryFileName">エントリーファイル名</label>
            <input
              type="text"
              id="entryFileName"
              placeholder="例: main.ts"
              value="main.ts"
            />
          </div>

          <div class="field">
            <label for="outputFileName">出力ファイル名</label>
            <input
              type="text"
              id="outputFileName"
              placeholder="例: index.js"
              value="index.js"
            />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="moduleType">module</label>
            <select id="moduleType">
              <option value="esnext">esnext</option>
              <option value="commonjs">commonjs</option>
              <option value="system">system</option>
            </select>
          </div>

          <div class="field">
            <label for="targetType">target</label>
            <select id="targetType">
              <option value="es2020">es2020</option>
              <option value="es2019">es2019</option>
              <option value="es2017">es2017</option>
              <option value="es6">es6</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="mainTsCode">メインTypeScriptコード</label>
          <textarea id="mainTsCode" spellcheck="false">const message: string = "browser-build-workshop";
const version: number = 1;

function boot(name: string): string {
  return `hello ${name}`;
}

console.log(message, version);
console.log(boot("TypeScript"));
</textarea>
        </div>

        <div class="field">
          <label for="subFileName">補助ファイル名</label>
          <input
            type="text"
            id="subFileName"
            placeholder="例: utils.ts"
          />
        </div>

        <div class="field">
          <label for="subFileCode">補助TypeScriptコード</label>
          <textarea
            id="subFileCode"
            spellcheck="false"
            placeholder="ここに補助TSファイルの中身を入れる"
          ></textarea>
        </div>

        <div class="checkboxes">
          <label class="checkbox">
            <input type="checkbox" id="enableMinify" />
            圧縮を有効にする
          </label>

          <label class="checkbox">
            <input type="checkbox" id="enableObfuscation" />
            難読化を有効にする
          </label>

          <label class="checkbox">
            <input type="checkbox" id="enableSourceMap" />
            source map を出力対象に含める
          </label>
        </div>

        <div class="file-list" id="subFilesList">
          <div class="file-item">
            <span>補助ファイルはまだ追加されていません</span>
            <span>-</span>
          </div>
        </div>

        <div class="button-row">
          <button class="btn btn-secondary" id="addSubFileButton">補助ファイルを追加</button>
          <button class="btn btn-primary" id="runBuildButton">変換を実行</button>
          <button class="btn btn-danger" id="clearAllButton">入力を初期化</button>
        </div>

        <div class="notice">
          この段階では本物のTS変換本体は未接続。
          先にUIとファイル管理構造を固め、その後で実変換処理を追加する。
        </div>
      </article>

      <article class="panel">
        <h2>状態・ログ・出力</h2>

        <div class="status" id="buildStatus">状態: 待機中</div>

        <div class="field">
          <label>変換ログ</label>
          <div class="log-box" id="buildLog">まだ実行されていません。</div>
        </div>

        <div class="field">
          <label>出力内容</label>
          <div class="output-box" id="buildOutput">まだ出力はありません。</div>
        </div>

        <div class="button-row">
          <button class="btn btn-muted" id="downloadOutputButton">出力を保存</button>
          <button class="btn btn-muted" id="copyOutputButton">出力をコピー</button>
        </div>

        <div class="notice">
          今は仮出力として、変換設定と入力コードを整形表示する。
          実際のTS→JS変換は後で内部モジュールを足して接続する。
        </div>
      </article>
    </section>
  </main>

  <script src="../assets/js/common/navigation.js"></script>
  <script src="../assets/js/common/download.js"></script>
  <script src="../assets/js/common/clipboard.js"></script>
  <script src="../assets/js/common/file-list.js"></script>
  <script src="../assets/js/common/status.js"></script>
  <script src="../assets/js/ts/core/ts-state.js"></script>
<script src="../assets/js/ts/core/ts-file-store.js"></script>
<script src="../assets/js/ts/core/ts-logger.js"></script>
<script src="../assets/js/ts/core/ts-compiler.js"></script>
<script src="../assets/js/ts/core/ts-minifier.js"></script>
<script src="../assets/js/ts/core/ts-obfuscator.js"></script>
<script src="../assets/js/ts/core/ts-output-manager.js"></script>
<script src="../assets/js/ts/core/ts-storage.js"></script>
<script src="../assets/js/ts/core/ts-downloader.js"></script>
<script src="../assets/js/ts/ts-build-engine.js"></script>
<script src="../assets/js/ts/ts-build-page.js"></script></body>
</html>
