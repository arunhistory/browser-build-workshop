<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>TS Build | browser-build-workshop</title>
  <meta
    name="description"
    content="TypeScript を JavaScript に変換するページ"
  />
  <style>
    :root {
      --bg: #020617;
      --panel: #0f172a;
      --panel-2: #111827;
      --line: #334155;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #38bdf8;
      --accent-2: #22c55e;
      --danger: #f97316;
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #020617 0%, #0f172a 100%);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Hiragino Sans",
        "Hiragino Kaku Gothic ProN",
        "Noto Sans JP",
        "Yu Gothic",
        sans-serif;
      min-height: 100%;
    }

    button, select, input, textarea {
      font: inherit;
    }

    .page {
      width: min(1200px, calc(100% - 20px));
      margin: 0 auto;
      padding: 18px 0 32px;
    }

    .topbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .topbar-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .title-box {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 20px;
      padding: 18px 16px;
      box-shadow: var(--shadow);
    }

    .title-box h1 {
      margin: 0 0 8px;
      font-size: clamp(1.5rem, 4vw, 2.3rem);
      line-height: 1.2;
    }

    .title-box p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 0.95rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .panel {
      background: rgba(17, 24, 39, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 1.08rem;
      line-height: 1.3;
    }

    .muted {
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.7;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }

    .field label {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .field input[type="text"],
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #020617;
      color: var(--text);
      padding: 12px 14px;
      outline: none;
    }

    .field textarea {
      min-height: 220px;
      resize: vertical;
      line-height: 1.65;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .checkboxes {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text);
      font-size: 0.95rem;
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(148, 163, 184, 0.08);
      border: 1px solid rgba(148, 163, 184, 0.12);
      font-size: 0.93rem;
    }

    .button-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .btn {
      border: 0;
      border-radius: 14px;
      padding: 13px 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
      width: 100%;
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-1px);
      opacity: 0.96;
      outline: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #0284c7);
      color: white;
    }

    .btn-secondary {
      background: linear-gradient(135deg, var(--accent-2), #15803d);
      color: white;
    }

    .btn-muted {
      background: rgba(148, 163, 184, 0.12);
      color: var(--text);
      border: 1px solid rgba(148, 163, 184, 0.16);
    }

    .btn-danger {
      background: linear-gradient(135deg, var(--danger), #ea580c);
      color: white;
    }

    .log-box,
    .output-box {
      min-height: 180px;
      border-radius: 14px;
      background: #020617;
      border: 1px solid var(--line);
      padding: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.65;
      font-size: 0.93rem;
      overflow-wrap: anywhere;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.12);
      border: 1px solid rgba(148, 163, 184, 0.16);
      font-size: 0.9rem;
      color: var(--text);
      margin-bottom: 12px;
    }

    .notice {
      margin-top: 12px;
      border-left: 4px solid var(--danger);
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(249, 115, 22, 0.08);
      color: #fed7aa;
      font-size: 0.92rem;
      line-height: 1.7;
    }

    @media (min-width: 960px) {
      .layout {
        grid-template-columns: 1.1fr 0.9fr;
      }

      .row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .button-row {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .btn {
        width: auto;
        min-width: 180px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="topbar">
      <div class="topbar-actions">
        <button class="btn btn-muted" id="goHome">トップへ戻る</button>
        <button class="btn btn-secondary" id="goRustPage">Rust変換へ</button>
      </div>

      <div class="title-box">
        <h1>TS Build</h1>
        <p>
          TypeScript を JavaScript へ変換する作業ページ。
          今は土台ページとして、入力欄・補助ファイル・設定・ログ・出力欄を先に揃える。
        </p>
      </div>
    </section>

    <section class="layout">
      <article class="panel">
        <h2>入力と設定</h2>

        <div class="field">
          <label for="projectName">プロジェクト名</label>
          <input
            type="text"
            id="projectName"
            placeholder="例: sample-ts-project"
            value="sample-ts-project"
          />
        </div>

        <div class="row">
          <div class="field">
            <label for="entryFileName">エントリーファイル名</label>
            <input
              type="text"
              id="entryFileName"
              placeholder="例: main.ts"
              value="main.ts"
            />
          </div>

          <div class="field">
            <label for="outputFileName">出力ファイル名</label>
            <input
              type="text"
              id="outputFileName"
              placeholder="例: index.js"
              value="index.js"
            />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="moduleType">module設定</label>
            <select id="moduleType">
              <option value="esnext">ESNext</option>
              <option value="commonjs">CommonJS</option>
              <option value="none">None</option>
            </select>
          </div>

          <div class="field">
            <label for="targetType">target設定</label>
            <select id="targetType">
              <option value="es2020">ES2020</option>
              <option value="es2018">ES2018</option>
              <option value="es2015">ES2015</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="mainTsCode">メインTSコード</label>
          <textarea id="mainTsCode" spellcheck="false">const message: string = "browser-build-workshop";
const version: number = 1;

function boot(name: string): string {
  return `hello ${name}`;
}

console.log(message, version);
console.log(boot("TypeScript"));
</textarea>
        </div>

        <div class="field">
          <label for="subFileName">補助ファイル名</label>
          <input
            type="text"
            id="subFileName"
            placeholder="例: utils.ts"
          />
        </div>

        <div class="field">
          <label for="subFileCode">補助ファイルコード</label>
          <textarea
            id="subFileCode"
            spellcheck="false"
            placeholder="ここに補助TSファイルの中身を入れる"
          ></textarea>
        </div>

        <div class="checkboxes">
          <label class="checkbox">
            <input type="checkbox" id="enableMinify" />
            圧縮を有効にする
          </label>

          <label class="checkbox">
            <input type="checkbox" id="enableObfuscation" />
            難読化を有効にする
          </label>

          <label class="checkbox">
            <input type="checkbox" id="enableSourceMap" />
            source map を有効にする
          </label>
        </div>

        <div class="file-list" id="subFilesList">
          <div class="file-item">
            <span>補助ファイルはまだ追加されていません</span>
            <span>-</span>
          </div>
        </div>

        <div class="button-row">
          <button class="btn btn-secondary" id="addSubFileButton">補助ファイルを追加</button>
          <button class="btn btn-primary" id="runBuildButton">変換を実行</button>
          <button class="btn btn-danger" id="clearAllButton">入力を初期化</button>
        </div>

        <div class="notice">
          まだこの段階では本物のTypeScriptコンパイラ接続は入れていない。
          先に画面土台を完成させ、あとから変換本体を差し込む。
        </div>
      </article>

      <article class="panel">
        <h2>状態・ログ・出力</h2>

        <div class="status" id="buildStatus">状態: 待機中</div>

        <div class="field">
          <label for="buildLog">ログ</label>
          <div class="log-box" id="buildLog">まだ実行されていません。</div>
        </div>

        <div class="field">
          <label for="buildOutput">出力</label>
          <div class="output-box" id="buildOutput">まだ出力はありません。</div>
        </div>

        <div class="button-row">
          <button class="btn btn-muted" id="downloadOutputButton">出力を保存</button>
          <button class="btn btn-muted" id="copyOutputButton">出力をコピー</button>
        </div>

        <div class="notice">
          今は仮出力として、入力内容をもとに整形した結果を表示する。
          本物のTS→JS変換は次の内部ファイル追加後に接続する。
        </div>
      </article>
    </section>
  </main>

  <script>
    (() => {
      const goHome = document.getElementById("goHome");
      const goRustPage = document.getElementById("goRustPage");

      const projectName = document.getElementById("projectName");
      const entryFileName = document.getElementById("entryFileName");
      const outputFileName = document.getElementById("outputFileName");
      const moduleType = document.getElementById("moduleType");
      const targetType = document.getElementById("targetType");
      const mainTsCode = document.getElementById("mainTsCode");
      const subFileName = document.getElementById("subFileName");
      const subFileCode = document.getElementById("subFileCode");
      const enableMinify = document.getElementById("enableMinify");
      const enableObfuscation = document.getElementById("enableObfuscation");
      const enableSourceMap = document.getElementById("enableSourceMap");
      const subFilesList = document.getElementById("subFilesList");
      const runBuildButton = document.getElementById("runBuildButton");
      const clearAllButton = document.getElementById("clearAllButton");
      const addSubFileButton = document.getElementById("addSubFileButton");
      const buildStatus = document.getElementById("buildStatus");
      const buildLog = document.getElementById("buildLog");
      const buildOutput = document.getElementById("buildOutput");
      const downloadOutputButton = document.getElementById("downloadOutputButton");
      const copyOutputButton = document.getElementById("copyOutputButton");

      const subFiles = [];

      function move(path) {
        window.location.href = path;
      }

      function escapeHtml(value) {
        return value
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function renderSubFiles() {
        if (subFiles.length === 0) {
          subFilesList.innerHTML = `
            <div class="file-item">
              <span>補助ファイルはまだ追加されていません</span>
              <span>-</span>
            </div>
          `;
          return;
        }

        subFilesList.innerHTML = subFiles
          .map((file, index) => {
            return `
              <div class="file-item">
                <span>${index + 1}. ${escapeHtml(file.name)}</span>
                <span>${file.code.length} chars</span>
              </div>
            `;
          })
          .join("");
      }

      function setStatus(text) {
        buildStatus.textContent = `状態: ${text}`;
      }

      function addLog(text) {
        buildLog.textContent = text;
      }

      function setOutput(text) {
        buildOutput.textContent = text;
      }

      function createMockJsOutput() {
        const header = [
          `// project: ${projectName.value.trim() || "untitled-project"}`,
          `// entry: ${entryFileName.value.trim() || "main.ts"}`,
          `// output: ${outputFileName.value.trim() || "index.js"}`,
          `// module: ${moduleType.value}`,
          `// target: ${targetType.value}`,
          `// minify: ${enableMinify.checked ? "on" : "off"}`,
          `// obfuscation: ${enableObfuscation.checked ? "on" : "off"}`,
          `// sourcemap: ${enableSourceMap.checked ? "on" : "off"}`,
          ``
        ].join("\n");

        const body = [
          `/* mock converted output */`,
          mainTsCode.value.trim() || "// no input",
          ``,
          `/* sub files */`,
          ...subFiles.map((file) => `// ${file.name}\n${file.code.trim()}`)
        ].join("\n");

        return `${header}\n${body}`.trim();
      }

      goHome?.addEventListener("click", () => move("./index.html"));
      goRustPage?.addEventListener("click", () => move("./rust-build.html"));

      addSubFileButton?.addEventListener("click", () => {
        const name = subFileName.value.trim();
        const code = subFileCode.value.trim();

        if (!name) {
          setStatus("補助ファイル名不足");
          addLog("補助ファイル名を入力してください。");
          return;
        }

        if (!code) {
          setStatus("補助ファイルコード不足");
          addLog("補助ファイルコードを入力してください。");
          return;
        }

        subFiles.push({ name, code });
        subFileName.value = "";
        subFileCode.value = "";
        renderSubFiles();
        setStatus("補助ファイル追加完了");
        addLog(`補助ファイル "${name}" を追加しました。`);
      });

      runBuildButton?.addEventListener("click", () => {
        setStatus("変換実行中");
        addLog("TS変換を開始しました。\n現在は仮実行です。");
        const output = createMockJsOutput();
        setOutput(output);
        setStatus("変換完了");
        addLog(
          [
            "TS変換を完了しました。",
            `project: ${projectName.value.trim() || "untitled-project"}`,
            `entry: ${entryFileName.value.trim() || "main.ts"}`,
            `sub files: ${subFiles.length}`,
            "現在は仮出力です。本物の変換本体は後で接続します。"
          ].join("\n")
        );
      });

      clearAllButton?.addEventListener("click", () => {
        projectName.value = "sample-ts-project";
        entryFileName.value = "main.ts";
        outputFileName.value = "index.js";
        moduleType.value = "esnext";
        targetType.value = "es2020";
        mainTsCode.value = `const message: string = "browser-build-workshop";
const version: number = 1;

function boot(name: string): string {
  return \`hello \${name}\`;
}

console.log(message, version);
console.log(boot("TypeScript"));
`;
        subFileName.value = "";
        subFileCode.value = "";
        enableMinify.checked = false;
        enableObfuscation.checked = false;
        enableSourceMap.checked = false;
        subFiles.length = 0;
        renderSubFiles();
        setStatus("初期化完了");
        addLog("入力内容を初期状態に戻しました。");
        setOutput("まだ出力はありません。");
      });

      downloadOutputButton?.addEventListener("click", () => {
        const text = buildOutput.textContent || "";
        if (!text || text === "まだ出力はありません。") {
          setStatus("保存失敗");
          addLog("保存対象の出力がありません。");
          return;
        }

        const blob = new Blob([text], { type: "text/javascript;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = outputFileName.value.trim() || "index.js";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);

        setStatus("保存完了");
        addLog("出力ファイルを保存しました。");
      });

      copyOutputButton?.addEventListener("click", async () => {
        const text = buildOutput.textContent || "";
        if (!text || text === "まだ出力はありません。") {
          setStatus("コピー失敗");
          addLog("コピー対象の出力がありません。");
          return;
        }

        try {
          await navigator.clipboard.writeText(text);
          setStatus("コピー完了");
          addLog("出力内容をコピーしました。");
        } catch (error) {
          setStatus("コピー失敗");
          addLog("クリップボードへのコピーに失敗しました。");
        }
      });

      renderSubFiles();
    })();
  </script>
</body>
</html>
