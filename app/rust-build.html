<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>Rust Build | browser-build-workshop</title>
  <meta
    name="description"
    content="Rust を Wasm へ変換するためのビルド作業ページ"
  />
  <link rel="stylesheet" href="../assets/css/common.css" />
</head>
<body>
  <main class="page">
    <section class="topbar">
      <div class="topbar-actions">
        <button class="btn btn-muted" id="goHome" type="button">トップへ戻る</button>
        <button class="btn btn-secondary" id="goTsPage" type="button">TS変換へ</button>
      </div>

      <div class="title-box">
        <h1>Rust Build</h1>
        <p>
          Rust を Wasm へ向けて整えるビルド作業ページ。
          複数ファイル、Cargo相当設定、仮想FS、出力管理まで見据えた土台。
        </p>
      </div>
    </section>

    <section class="layout">
      <article class="panel">
        <h2>入力と設定</h2>

        <div class="field">
          <label for="projectName">プロジェクト名</label>
          <input
            type="text"
            id="projectName"
            placeholder="例: sample-rust-project"
            value="sample-rust-project"
          />
        </div>

        <div class="row">
          <div class="field">
            <label for="entryType">エントリーポイント</label>
            <select id="entryType">
              <option value="lib.rs">lib.rs</option>
              <option value="main.rs">main.rs</option>
            </select>
          </div>

          <div class="field">
            <label for="outputMode">出力形式</label>
            <select id="outputMode">
              <option value="wasm-js">.wasm + loader.js</option>
              <option value="wasm-only">.wasmのみ</option>
              <option value="js-only">loader.jsのみ</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="buildMode">ビルドモード</label>
            <select id="buildMode">
              <option value="release">release</option>
              <option value="debug">debug</option>
            </select>
          </div>

          <div class="field">
            <label for="crateType">crate-type</label>
            <select id="crateType">
              <option value="cdylib">cdylib</option>
              <option value="rlib">rlib</option>
              <option value="bin">bin</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="version">version</label>
            <input
              type="text"
              id="version"
              placeholder="例: 0.1.0"
              value="0.1.0"
            />
          </div>

          <div class="field">
            <label for="edition">edition</label>
            <select id="edition">
              <option value="2015">2015</option>
              <option value="2018">2018</option>
              <option value="2021" selected>2021</option>
              <option value="2024">2024</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="dependenciesText">dependencies</label>
          <textarea id="dependenciesText" spellcheck="false">wasm-bindgen = "0.2"</textarea>
        </div>

        <div class="field">
          <label for="featuresText">features</label>
          <textarea
            id="featuresText"
            spellcheck="false"
            placeholder="必要なら feature を1行ずつ入れる"
          ></textarea>
        </div>

        <div class="field">
          <label for="cargoToml">Cargo.toml 相当設定</label>
          <textarea id="cargoToml" spellcheck="false">[package]
name = "sample-rust-project"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
</textarea>
        </div>

        <div class="field">
          <label for="mainRustCode">メインRustコード</label>
          <textarea id="mainRustCode" spellcheck="false">use wasm_bindgen::prelude::*;

#[wasm_bindgen]
pub fn greet(name: &str) -> String {
    format!("hello {}", name)
}
</textarea>
        </div>

        <div class="field">
          <label for="subFileName">補助Rustファイル名</label>
          <input
            type="text"
            id="subFileName"
            placeholder="例: utils.rs"
          />
        </div>

        <div class="field">
          <label for="subFileCode">補助Rustファイルコード</label>
          <textarea
            id="subFileCode"
            spellcheck="false"
            placeholder="ここに補助Rustファイルの中身を入れる"
          ></textarea>
        </div>

        <div class="file-list" id="subFilesList">
          <div class="file-item">
            <span>補助Rustファイルはまだ追加されていません</span>
            <span>-</span>
          </div>
        </div>

        <div class="button-row">
          <button class="btn btn-secondary" id="addSubFileButton" type="button">補助ファイルを追加</button>
          <button class="btn btn-primary" id="runBuildButton" type="button">ビルドを実行</button>
          <button class="btn btn-danger" id="clearAllButton" type="button">入力を初期化</button>
        </div>

        <div class="notice">
          入力検証、依存確認、仮想FS構築、モジュール管理、コンパイラ接続までをこのページから呼び出します。
        </div>
      </article>

      <article class="panel">
        <h2>状態・ログ・出力</h2>

        <div class="status" id="buildStatus">状態: 待機中</div>

        <div class="field">
          <label for="buildLog">ビルドログ</label>
          <textarea id="buildLog" class="log-box" spellcheck="false" readonly>まだ実行されていません。</textarea>
        </div>

        <div class="field">
          <label for="buildOutput">出力内容</label>
          <textarea id="buildOutput" class="output-box" spellcheck="false" readonly>まだ出力はありません。</textarea>
        </div>

        <div class="field">
          <label>分解表示</label>
          <div id="buildOutputFiles" class="build-output-files">
            <div class="file-output-item">
              <label for="outputFileBuildLog">build-log.txt</label>
              <textarea
                id="outputFileBuildLog"
                class="output-box file-output-box"
                spellcheck="false"
                readonly
              ></textarea>
            </div>

            <div class="file-output-item">
              <label for="outputFileBundle">bundle / outputText</label>
              <textarea
                id="outputFileBundle"
                class="output-box file-output-box"
                spellcheck="false"
                readonly
              ></textarea>
            </div>

            <div class="file-output-item">
              <label for="outputFileWasm">.wasm</label>
              <textarea
                id="outputFileWasm"
                class="output-box file-output-box"
                spellcheck="false"
                readonly
              ></textarea>
            </div>

            <div class="file-output-item">
              <label for="outputFileLoaderJs">.loader.js</label>
              <textarea
                id="outputFileLoaderJs"
                class="output-box file-output-box"
                spellcheck="false"
                readonly
              ></textarea>
            </div>

            <div class="file-output-item">
              <label for="outputFileExampleJs">.example.js</label>
              <textarea
                id="outputFileExampleJs"
                class="output-box file-output-box"
                spellcheck="false"
                readonly
              ></textarea>
            </div>
          </div>
        </div>

        <div class="field">
          <label>ビルド要約</label>
          <div class="summary-box" id="buildSummary">まだ要約はありません。</div>
        </div>

        <div class="button-row">
          <button class="btn btn-muted" id="downloadOutputButton" type="button">出力を保存</button>
          <button class="btn btn-muted" id="downloadLogButton" type="button">ログを保存</button>
          <button class="btn btn-muted" id="copyOutputButton" type="button">出力をコピー</button>
        </div>

        <div class="notice">
          `rust-build-module-manager.js` と `rust-real-compiler.js` を先に読み込み、
          その上で controller と page から利用する構成です。
        </div>
      </article>
    </section>
  </main>

  <script src="../assets/js/rust/rust-virtual-fs.js"></script>
  <script src="../assets/js/rust/rust-dependency-manager.js"></script>
  <script src="../assets/js/rust/rust-build-module-manager.js"></script>
  <script src="../assets/js/rust/rust-real-compiler.js"></script>
  <script src="../assets/js/rust/rust-build-controller.js"></script>
  <script src="../assets/js/rust/rust-build-page.js"></script>
</body>
</html>
