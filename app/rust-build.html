<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>Rust Build | browser-build-workshop</title>
  <meta
    name="description"
    content="Rust を Wasm へ変換するためのビルド作業ページ"
  />
  <link rel="stylesheet" href="../assets/css/common.css" />
</head>
<body>
  <main class="page">
    <section class="topbar">
      <div class="topbar-actions">
        <button class="btn btn-muted" id="goHome">トップへ戻る</button>
        <button class="btn btn-secondary" id="goTsPage">TS変換へ</button>
      </div>

      <div class="title-box">
        <h1>Rust Build</h1>
        <p>
          Rust を Wasm へ向けて整えるビルド作業ページ。
          単一ファイル変換ではなく、複数ファイル・Cargo相当設定・出力管理まで見据えた土台として作る。
        </p>
      </div>
    </section>

    <section class="layout">
      <article class="panel">
        <h2>入力と設定</h2>

        <div class="field">
          <label for="projectName">プロジェクト名</label>
          <input
            type="text"
            id="projectName"
            placeholder="例: sample-rust-project"
            value="sample-rust-project"
          />
        </div>

        <div class="row">
          <div class="field">
            <label for="entryType">エントリーポイント</label>
            <select id="entryType">
              <option value="lib.rs">lib.rs</option>
              <option value="main.rs">main.rs</option>
            </select>
          </div>

          <div class="field">
            <label for="outputMode">出力形式</label>
            <select id="outputMode">
              <option value="wasm-js">.wasm + loader.js</option>
              <option value="wasm-only">.wasmのみ</option>
              <option value="zip">ZIP一括</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="buildMode">ビルドモード</label>
            <select id="buildMode">
              <option value="release">release</option>
              <option value="debug">debug</option>
            </select>
          </div>

          <div class="field">
            <label for="crateType">crate-type</label>
            <select id="crateType">
              <option value="cdylib">cdylib</option>
              <option value="rlib">rlib</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="cargoToml">Cargo.toml 相当設定</label>
          <textarea id="cargoToml" spellcheck="false">[package]
name = "sample-rust-project"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
</textarea>
        </div>

        <div class="field">
          <label for="mainRustCode">メインRustコード</label>
          <textarea id="mainRustCode" spellcheck="false">use wasm_bindgen::prelude::*;

#[wasm_bindgen]
pub fn greet(name: &str) -> String {
    format!("hello {}", name)
}
</textarea>
        </div>

        <div class="field">
          <label for="subFileName">補助Rustファイル名</label>
          <input
            type="text"
            id="subFileName"
            placeholder="例: utils.rs"
          />
        </div>

        <div class="field">
          <label for="subFileCode">補助Rustファイルコード</label>
          <textarea
            id="subFileCode"
            spellcheck="false"
            placeholder="ここに補助Rustファイルの中身を入れる"
          ></textarea>
        </div>

        <div class="checkboxes">
          <label class="checkbox">
            <input type="checkbox" id="enableWasmBindgen" checked />
            wasm-bindgen を使う
          </label>

          <label class="checkbox">
            <input type="checkbox" id="enableOptimize" checked />
            出力最適化を有効にする
          </label>

          <label class="checkbox">
            <input type="checkbox" id="enableJsLoader" checked />
            loader.js を出力対象に含める
          </label>
        </div>

        <div class="file-list" id="subFilesList">
          <div class="file-item">
            <span>補助Rustファイルはまだ追加されていません</span>
            <span>-</span>
          </div>
        </div>

        <div class="button-row">
          <button class="btn btn-secondary" id="addSubFileButton">補助ファイルを追加</button>
          <button class="btn btn-primary" id="runBuildButton">ビルドを実行</button>
          <button class="btn btn-danger" id="clearAllButton">入力を初期化</button>
        </div>

        <div class="notice">
          この段階では本物のRustコンパイル本体は未接続。
          先にUIと管理構造を固め、その後で仮想FS・依存管理・ビルド制御を追加する。
        </div>
      </article>

      <article class="panel">
        <h2>状態・ログ・出力</h2>

        <div class="status" id="buildStatus">状態: 待機中</div>

        <div class="field">
          <label>ビルドログ</label>
          <div class="log-box" id="buildLog">まだ実行されていません。</div>
        </div>

        <div class="field">
          <label>出力内容</label>
          <div class="output-box" id="buildOutput">まだ出力はありません。</div>
        </div>

        <div class="button-row">
          <button class="btn btn-muted" id="downloadOutputButton">出力を保存</button>
          <button class="btn btn-muted" id="copyOutputButton">出力をコピー</button>
        </div>

        <div class="notice">
          今は仮出力として、ビルド情報とRust入力内容を整形表示する。
          実際の `.wasm` 生成は後で内部モジュールを足して接続する。
        </div>
      </article>
    </section>
  </main>

  <script src="../assets/js/common/navigation.js"></script>
  <script src="../assets/js/common/download.js"></script>
  <script src="../assets/js/common/clipboard.js"></script>
  <script src="../assets/js/common/file-list.js"></script>
  <script src="../assets/js/common/status.js"></script>
  <script src="../assets/js/rust/rust-build-page.js"></script>
</body>
</html>
