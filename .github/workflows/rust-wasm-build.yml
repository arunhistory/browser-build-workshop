name: Rust Wasm Build

on:
  workflow_dispatch:
    inputs:
      buildRequestJson:
        description: "Rust build request JSON"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build Rust to Wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          node --version
          wasm-bindgen --version
          zip --version

      - name: Run Rust Wasm build
        env:
          BUILD_REQUEST_JSON: ${{ inputs.buildRequestJson }}
        run: node tools/build-rust-wasm.mjs

      - name: Prepare page output directory
        run: |
          rm -rf app/rust-output
          mkdir -p app/rust-output
          cp -R .generated/dist/. app/rust-output/

      - name: Show page output files
        run: |
          echo "=== app/rust-output ==="
          find app/rust-output -maxdepth 2 -type f -print

      - name: Commit generated page output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/rust-output

          if git diff --cached --quiet; then
            echo "No generated output changes."
          else
            git commit -m "Update Rust Wasm build output"
            git push
          fi

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-wasm-build
          path: app/rust-output
          if-no-files-found: error