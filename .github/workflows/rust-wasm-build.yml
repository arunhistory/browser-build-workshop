name: Rust Wasm Build

on:
  workflow_dispatch:
    inputs:
      buildRequestJson:
        description: "Rust build request JSON"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: rust-wasm-build-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Rust to Wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          node --version
          wasm-bindgen --version
          zip --version

      - name: Run Rust Wasm build
        env:
          BUILD_REQUEST_JSON: ${{ inputs.buildRequestJson }}
        run: node tools/build-rust-wasm.mjs

      - name: Prepare page output directory
        run: |
          rm -rf app/rust-output
          mkdir -p app/rust-output
          cp -r .generated/dist/. app/rust-output/

      - name: Show generated page files
        run: |
          echo "=== app/rust-output ==="
          find app/rust-output -maxdepth 2 -type f -print

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-wasm-build
          path: .generated/dist
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4