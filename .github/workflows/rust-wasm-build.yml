name: Rust Wasm Build

on:
  workflow_dispatch:
    inputs:
      buildRequestJson:
        description: "Rust build request JSON"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build Rust to Wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli

      - name: Show tool versions
        run: |
          rustc --version
          cargo --version
          node --version
          wasm-bindgen --version

      - name: Run Rust Wasm build
        env:
          BUILD_REQUEST_JSON: ${{ inputs.buildRequestJson }}
        run: node tools/build-rust-wasm.mjs

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-wasm-build
          path: .generated/dist
          if-no-files-found: error